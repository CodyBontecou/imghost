name: imghost7 bounded no-device Mac version metadata
on:
  push:
    branches: [prep/qualification/imghost7-mac-no-device-versions-20261007]
    paths: [.github/workflows/imghost7-mac-no-device-versions.yml]
permissions:
  contents: read
concurrency:
  group: imghost7-no-device-versions-${{ github.ref }}
  cancel-in-progress: false
jobs:
  passive-toolchain:
    runs-on: macos-15
    timeout-minutes: 5
    steps:
      - name: Materialize three sealed metadata controls without checkout
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 131072
          python3 - <<'PY_BOOTSTRAP'
          import base64,hashlib,json,os,pathlib,shutil,sys
          assert sys.version_info >= (3,9)
          assert os.environ['GITHUB_ACTIONS']=='true' and os.environ['RUNNER_OS']=='macOS'
          assert os.environ['RUNNER_ENVIRONMENT']=='github-hosted' and os.environ['GITHUB_REPOSITORY']=='CodyBontecou/imghost'
          assert os.environ['GITHUB_EVENT_NAME']=='push' and os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert 'SWIFTCI_USE_LOCAL_DEPS' not in os.environ
          assert shutil.disk_usage('/').free >= 20*1024**3
          materials={'controller.py': '', 'owned_runner.py': '', 'metadata_helper.py': ''}
          digests={'controller.py': 'cc8cf6e55b735f4ac6075a80d18aa5a6f88083377d5d561f459efe412d395bad', 'owned_runner.py': '5d9d1b4875bca9685c490445c59367d0f5917c7676cd6cd60d2939a48c5f19af', 'metadata_helper.py': 'f02391504e42b1feb6c551cdb40d69bc8d8a0e139f62b01cc5cf785bcda8d0fc'}
          assert set(materials)==set(digests)=={'controller.py','owned_runner.py','metadata_helper.py'}
          raw={name:base64.b64decode(value,validate=True) for name,value in materials.items()}
          assert sum(map(len,raw.values()))==29636 and all(len(value)<=32768 for value in raw.values())
          assert all(hashlib.sha256(value).hexdigest()==digests[name] for name,value in raw.items())
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'imghost7-no-device-metadata-bootstrap'
          assert root.parent.is_absolute() and root.parent.resolve(strict=True)==root.parent
          assert not root.exists() and not root.is_symlink()
          root.mkdir(mode=0o700)
          for name in ('outerhome','outertmp'): (root/name).mkdir(mode=0o700)
          for name,value in raw.items():
              with (root/name).open('xb') as stream: assert stream.write(value)==len(value)
          print(json.dumps({'kind':'PASSIVE_BOOTSTRAP_ONLY','payloads':digests,'python_executable':sys.executable,'python_version':sys.version,'limits':'Sealed control source only; interpreter path/version not loaded-origin or product qualification.'}),flush=True)
          PY_BOOTSTRAP
      - name: Run finite version-only preflight with unchanged compiler resource floors
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 131072
          python3 - <<'PY_CALLER'
          import hashlib,json,os,pathlib,shutil,sys,types
          assert sys.version_info >= (3,9)
          assert 'SWIFTCI_USE_LOCAL_DEPS' not in os.environ
          assert shutil.disk_usage('/').free >= 20*1024**3
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'imghost7-no-device-metadata-bootstrap'
          assert root.resolve(strict=True)==root and not root.is_symlink()
          expected={'controller.py': 'cc8cf6e55b735f4ac6075a80d18aa5a6f88083377d5d561f459efe412d395bad', 'owned_runner.py': '5d9d1b4875bca9685c490445c59367d0f5917c7676cd6cd60d2939a48c5f19af', 'metadata_helper.py': 'f02391504e42b1feb6c551cdb40d69bc8d8a0e139f62b01cc5cf785bcda8d0fc'}
          for name,digest in expected.items():
              path=root/name
              assert path.is_file() and not path.is_symlink() and path.stat().st_uid==os.getuid()
              value=path.read_bytes()
              assert len(value)<=32768 and hashlib.sha256(value).hexdigest()==digest
          runner_bytes=(root/'owned_runner.py').read_bytes()
          assert len(runner_bytes)==7443 and hashlib.sha256(runner_bytes).hexdigest()==expected['owned_runner.py']
          runner=types.ModuleType('passive_preflight_outer_library')
          runner.__file__=str(root/'owned_runner.py')
          exec(compile(runner_bytes,runner.__file__,'exec'),runner.__dict__)
          keys=('GITHUB_ACTIONS','RUNNER_OS','RUNNER_ENVIRONMENT','GITHUB_REPOSITORY','GITHUB_EVENT_NAME','GITHUB_RUN_ATTEMPT','GITHUB_REF','GITHUB_SHA','GITHUB_WORKFLOW_SHA','GITHUB_WORKFLOW_REF','RUNNER_TEMP')
          env={key:os.environ[key] for key in keys}
          env.update(PATH='/usr/bin:/bin:/usr/sbin:/sbin',HOME=str(root/'outerhome'),CFFIXED_USER_HOME=str(root/'outerhome'),TMPDIR=str(root/'outertmp')+'/',PYTHONDONTWRITEBYTECODE='1',GIT_ALLOW_PROTOCOL='')
          print(json.dumps({'kind':'PASSIVE_OUTER_STARTED','head':env['GITHUB_SHA'],'limits':'200s/1MiB combined output; nested root-pipe receipts not all SDK descendants/service/device cleanup.'}),flush=True)
          try:
              receipt=runner.run_owned([sys.executable,str(root/'controller.py')],cwd=root,env=env,timeout=200,output_path=root/'outer.log',output_cap=1048576,sink=sys.stdout.buffer.write)
          except runner.RunFailure as error:
              print(json.dumps({'kind':'PASSIVE_OUTER_STOP','receipt':error.receipt}),flush=True)
              raise
          print(json.dumps({'kind':'PASSIVE_OUTER_FINISHED','receipt':receipt,'limits':'Passive toolchain metadata only; no source acquisition, package resolution, product build/test, simulator/device/signing or adoption.'}),flush=True)
          PY_CALLER
