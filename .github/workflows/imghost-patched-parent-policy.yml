name: imghost patched-parent early policy (not graph or native)
on:
  push:
    branches: ["prep/qualification/imghost-patched-parent-policy-20261008"]
    paths: [".github/workflows/imghost-patched-parent-policy.yml"]
permissions:
  contents: read
concurrency:
  group: imghost-patched-parent-policy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  early-virtual-policy:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Pinned six early policy cases and independent controls
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 -I -B -S - <<'EARLY_VIRTUAL_POLICY_BOOTSTRAP'
          """UNEXECUTED sealed Linux bootstrap template; substitute pinned payload literals."""
          import os
          
          os.umask(0o077)
          
          import base64
          import hashlib
          import json
          from pathlib import Path
          import stat
          import sys
          import zlib
          
          SEALED_PAYLOAD = ''
          PAYLOAD_SHA256 = 'b3dd60fef1bc1df8ff9a2fb7668d31537b2f8947644b29775b8caee9ab4300d4'
          EXPECTED_FILES = {'helper.py': [7445, '875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303'], 'caller.py': [9955, '13ea77681ba4704d5c9c1b98183dfbb8246012c1de4d19b1ba4537f9992afd9b'], 'child-loader.py': [7240, 'a8585b146578b78acb0700aa9d6a59b4e26676840fd557e447e2edf457fb93c1'], 'test-inputs.json': [11273, 'c873893962fe3b5724581b777d5a81456a2cc41ba3cf9560a58bf93fdd2447a1']}
          OUTER_SECONDS = 140
          OUTER_OUTPUT_CAP = 131072
          
          
          def require(ok, message):
              if not ok:
                  raise RuntimeError("Early virtual policy outer bootstrap STOP: " + message)
          
          
          def private_read(rootfd, name, cap):
              fd = os.open(name, os.O_RDONLY | os.O_CLOEXEC | os.O_NOFOLLOW, dir_fd=rootfd)
              try:
                  before = os.fstat(fd)
                  require(stat.S_ISREG(before.st_mode) and before.st_uid == os.getuid()
                          and stat.S_IMODE(before.st_mode) == 0o600 and before.st_nlink == 1
                          and 0 < before.st_size <= cap, "bounded private file lease")
                  raw = os.read(fd, before.st_size)
                  require(len(raw) == before.st_size, "short private read")
                  after = os.fstat(fd)
                  require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns), "file drift")
                  return raw
              finally:
                  os.close(fd)
          
          
          
          def runtime_origin():
              require(sys.implementation.name == "cpython" and sys.version_info[:2] == (3, 12)
                      and sys.flags.isolated == 1 and sys.flags.no_site == 1
                      and sys.flags.ignore_environment == 1 and sys.flags.no_user_site == 1
                      and sys.dont_write_bytecode, "isolated no-site CPython3.12")
              import sysconfig
              library = Path(sysconfig.get_path("stdlib")).resolve()
              binary = Path(sys.executable).resolve(strict=True)
              meta = binary.stat()
              require(stat.S_ISREG(meta.st_mode) and meta.st_uid in (0, os.getuid())
                      and not (stat.S_IMODE(meta.st_mode) & 0o022), "provider interpreter metadata")
              require(len(sys.path) <= 16 and len(sys.modules) <= 256, "bounded runtime origins")
              for item in sys.path:
                  require(type(item) is str and item and len(item) <= 512
                          and Path(item).is_absolute() and Path(item).resolve().is_relative_to(library.parent)
                          and "site-packages" not in Path(item).parts, "stdlib-only isolated paths")
              origins = []
              for name, module in tuple(sys.modules.items()):
                  origin = getattr(getattr(module, "__spec__", None), "origin", None)
                  if origin in ("built-in", "frozen"):
                      origins.append((name, origin))
                  elif origin is None:
                      require(name == "__main__", "unqualified originless module")
                  else:
                      require(type(origin) is str and len(origin) <= 512, "origin bound")
                      source = Path(origin).resolve(strict=True)
                      require(source.is_relative_to(library), "nonstdlib module origin")
                      source_meta = source.stat()
                      require(stat.S_ISREG(source_meta.st_mode) and source_meta.st_uid in (0, os.getuid())
                              and not (stat.S_IMODE(source_meta.st_mode) & 0o022), "stdlib file metadata")
                      origins.append((name, str(source)))
              print("EARLY_VIRTUAL_POLICY_PYTHON_RUNTIME_ORIGIN=" + json.dumps({"version": sys.version,
                    "binary": str(binary), "binary_dev_inode_size_mtime":
                    [meta.st_dev, meta.st_ino, meta.st_size, meta.st_mtime_ns],
                    "stdlib": str(library), "paths": sys.path, "module_origin_count": len(origins),
                    "module_origin_catalog_sha256": hashlib.sha256(json.dumps(sorted(origins)).encode()).hexdigest(),
                    "no_site": True, "native_pass_claim": False}, sort_keys=True), flush=True)
              # Provider/path metadata is not a binary loaded-image or lifetime/sandbox proof.
          
          def main():
              runtime_origin()
              require(sys.platform.startswith("linux") and os.environ.get("GITHUB_ACTIONS") == "true"
                      and os.environ.get("RUNNER_OS") == "Linux"
                      and os.environ.get("RUNNER_ENVIRONMENT") == "github-hosted", "actual hosted Linux")
              require(sys.flags.isolated == 1 and sys.dont_write_bytecode, "isolated no-bytecode bootstrap")
              require(os.umask(0o077) == 0o077, "private mask")
              require(not any(os.environ.get(k) for k in ("GH_TOKEN", "GITHUB_TOKEN", "PYTHONPATH",
                      "NODE_OPTIONS", "LD_PRELOAD", "LD_LIBRARY_PATH")), "credential/loader environment")
              require(type(SEALED_PAYLOAD) is str and len(SEALED_PAYLOAD) <= 87384,
                      "bounded sealed payload")
              compressed = base64.b64decode(SEALED_PAYLOAD, validate=True)
              decoder = zlib.decompressobj()
              raw = decoder.decompress(compressed, 65536)
              require(decoder.eof and not decoder.unconsumed_tail and not decoder.unused_data
                      and len(raw) <= 65536 and hashlib.sha256(raw).hexdigest() == PAYLOAD_SHA256,
                      "bounded single-stream sealed payload digest")
              packed = json.loads(raw)
              require(type(EXPECTED_FILES) is dict and type(packed) is dict
                      and set(packed) == set(EXPECTED_FILES)
                      == {"helper.py", "caller.py", "child-loader.py", "test-inputs.json"},
                      "exact sealed four files")
              decoded = {}
              for name, (size, digest) in EXPECTED_FILES.items():
                  require(type(size) is int and 0 < size <= 32768 and type(packed[name]) is str
                          and len(packed[name]) <= 4 * ((size + 2) // 3), "encoded file bounds")
                  data = base64.b64decode(packed[name], validate=True)
                  require(len(data) == size and hashlib.sha256(data).hexdigest() == digest,
                          "sealed file pin")
                  decoded[name] = data
              temp = Path(os.environ["RUNNER_TEMP"])
              require(temp.is_absolute() and temp.resolve() == temp and not temp.is_symlink(),
                      "canonical provider temp")
              tempfd = os.open(temp, os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC | os.O_NOFOLLOW)
              rootfd = None
              try:
                  provider = os.fstat(tempfd)
                  require(provider.st_uid == os.getuid(), "provider temp UID")
                  capacity = os.statvfs(temp)
                  available = next(int(line.split()[1]) * 1024
                                   for line in Path("/proc/meminfo").read_text().splitlines()
                                   if line.startswith("MemAvailable:"))
                  require(capacity.f_bavail * capacity.f_frsize >= 10 * 1024**3
                          and available >= 3 * 1024**3, "unchanged Linux resource floors")
                  rootname = "imghost-early-virtual-policy-" + os.urandom(8).hex()
                  os.mkdir(rootname, 0o700, dir_fd=tempfd)
                  root = temp / rootname
                  rootfd = os.open(rootname, os.O_RDONLY | os.O_DIRECTORY | os.O_CLOEXEC | os.O_NOFOLLOW,
                                   dir_fd=tempfd)
                  rootmeta = os.fstat(rootfd)
                  require(rootmeta.st_uid == os.getuid() and stat.S_IMODE(rootmeta.st_mode) == 0o700,
                          "fresh private root")
                  for name, data in decoded.items():
                      fd = os.open(name, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_CLOEXEC | os.O_NOFOLLOW,
                                   0o600, dir_fd=rootfd)
                      try:
                          os.fchmod(fd, 0o600)
                          require(os.write(fd, data) == len(data), "short sealed file write")
                      finally:
                          os.close(fd)
                      actual = private_read(rootfd, name, EXPECTED_FILES[name][0])
                      require(actual == data, "written source byte identity")
                  for name in ("env-home", "env-tmp"):
                      os.mkdir(name, 0o700, dir_fd=rootfd)
                  helperraw = private_read(rootfd, "helper.py", EXPECTED_FILES["helper.py"][0])
                  require(hashlib.sha256(helperraw).hexdigest() == EXPECTED_FILES["helper.py"][1],
                          "loaded helper source pin")
                  namespace = {"__name__": "qualified_early_virtual_policy_outer_helper", "__file__": str(root / "helper.py")}
                  exec(compile(helperraw, str(root / "helper.py"), "exec"), namespace)
                  env = {"PATH": "/usr/bin:/bin", "HOME": str(root / "env-home"),
                         "TMPDIR": str(root / "env-tmp"), "LANG": "C.UTF-8", "LC_ALL": "C.UTF-8",
                         "GITHUB_ACTIONS": "true", "RUNNER_OS": "Linux",
                         "RUNNER_ENVIRONMENT": "github-hosted", "GIT_ALLOW_PROTOCOL": ""}
                  argv = [sys.executable, "-I", "-B", "-S", str(root / "child-loader.py")]
                  try:
                      receipt = namespace["run_owned"](argv, cwd=root, env=env, timeout=OUTER_SECONDS,
                                                       output_path=root / "outer-combined.log",
                                                       output_cap=OUTER_OUTPUT_CAP)
                  except namespace["RunFailure"] as error:
                      # Reporting must not mask the original owned-runner exception.
                      try:
                          print("EARLY_VIRTUAL_POLICY_OUTER_STOP=" + json.dumps(error.receipt, sort_keys=True),
                                flush=True)
                      except BaseException:
                          pass
                      raise
                  require(receipt["returncode"] == 0 and receipt["finite_root_pipe_cleanup_verified"]
                          and receipt["pipe_eof"] and receipt["owned_stdout_closed"]
                          and receipt["owned_output_closed"] and not receipt["output_limited"]
                          and receipt["cleanup_exception_types"] == []
                          and receipt["cleanup_elapsed_seconds"] <= 8
                          and receipt["accepted_output_bytes"] == receipt["observed_pipe_bytes"],
                          "complete owned outer receipt")
                  current = root.lstat()
                  require(root.resolve() == root and not root.is_symlink()
                          and (current.st_dev, current.st_ino) == (rootmeta.st_dev, rootmeta.st_ino)
                          and current.st_uid == os.getuid() and stat.S_IMODE(current.st_mode) == 0o700,
                          "post-run private root lease")
                  for name, (_, digest) in EXPECTED_FILES.items():
                      data = private_read(rootfd, name, EXPECTED_FILES[name][0])
                      require(hashlib.sha256(data).hexdigest() == digest, "post-run input drift")
                  output = private_read(rootfd, "outer-combined.log", OUTER_OUTPUT_CAP)
                  require(len(output) == receipt["accepted_output_bytes"]
                          and hashlib.sha256(output).hexdigest() == receipt["accepted_output_sha256"],
                          "outer output file/receipt identity")
                  text = output.decode("utf-8", errors="strict")
                  prefix = "EARLY_VIRTUAL_POLICY_CLOUD_TERMINAL="
                  records = [line[len(prefix):] for line in text.splitlines() if line.startswith(prefix)]
                  require(len(records) == 1, "one terminal source-policy record")
                  terminal = json.loads(records[0])
                  require(terminal["status"] == "EARLY_VIRTUAL_POLICY_POSITIVE6_TWO_INDEPENDENT_CONTROL1_FAILURES_NOT_GENERATION"
                          and terminal["native_pass_claim"] is False
                          and [item["variant"] for item in terminal["results"]]
                          == ["positive", "single-use-guard-removed", "required-edge-guard-removed"], "expected terminal")
                  print(text, end="", flush=True)
                  print("EARLY_VIRTUAL_POLICY_OUTER_RESULT=" + json.dumps({"receipt": receipt,
                        "source_pins": EXPECTED_FILES, "native_pass_claim": False}, sort_keys=True), flush=True)
                  return 0
              finally:
                  if rootfd is not None:
                      os.close(rootfd)
                  os.close(tempfd)
          
          
          if __name__ == "__main__":
              raise SystemExit(main())
          EARLY_VIRTUAL_POLICY_BOOTSTRAP
