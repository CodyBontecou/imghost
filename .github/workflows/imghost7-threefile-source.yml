name: imghost three-file source qualification
on:
  push:
    branches: [prep/qualification/imghost7-threefile-source-20261007]
permissions:
  contents: read
concurrency:
  group: imghost7-threefile-source-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: Finite isolated source assembly only, no SDK/compiler/native tests
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -I - <<'PY'
          import base64, hashlib, os, pathlib, shutil, sys, time, types
          assert os.environ['GITHUB_REPOSITORY'] == 'CodyBontecou/imghost'
          assert os.environ['RUNNER_OS'] == 'Linux' and os.environ['RUNNER_ENVIRONMENT'] == 'github-hosted'
          assert os.environ['GITHUB_EVENT_NAME'] == 'push' and os.environ['GITHUB_RUN_ATTEMPT'] == '1'
          assert os.environ['GITHUB_REF'] == 'refs/heads/prep/qualification/imghost7-threefile-source-20261007'
          assert os.environ['GITHUB_SHA'] == os.environ['GITHUB_WORKFLOW_SHA']
          assert shutil.disk_usage(os.environ['RUNNER_TEMP']).free >= 10*1024**3
          memory = next(int(x.split()[1])*1024 for x in pathlib.Path('/proc/meminfo').read_text().splitlines() if x.startswith('MemAvailable:'))
          assert memory >= 3*1024**3
          os.umask(0o077)
          root = pathlib.Path(os.environ['RUNNER_TEMP'])/'imghost7-source-bootstrap-owned'
          assert not root.exists() and not root.is_symlink()
          root.mkdir(mode=0o700)
          for name in ('home','tmp'): (root/name).mkdir(mode=0o700)
          raw = base64.b64decode('', validate=True)
          assert len(raw) == 7445 and hashlib.sha256(raw).hexdigest() == '875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303'
          with (root/'owned_runner.py').open('xb') as stream: stream.write(raw)
          raw = base64.b64decode('', validate=True)
          assert len(raw) == 12596 and hashlib.sha256(raw).hexdigest() == '4a6e371195a77d8072e76085464b0900d14cc9943403b2a8fad5570a40cdb7ee'
          with (root/'controller.py').open('xb') as stream: stream.write(raw)
          raw = base64.b64decode('', validate=True)
          assert len(raw) == 7702 and hashlib.sha256(raw).hexdigest() == '332f14db0e15e7b1e5c374813e0734a464df66a6aa8c48a092d7db64a76897d1'
          with (root/'editpack.json').open('xb') as stream: stream.write(raw)
          raw = base64.b64decode('', validate=True)
          assert len(raw) == 733 and hashlib.sha256(raw).hexdigest() == '56254fd351c17d967964e8c15259a5106bb7a1d01c7e7cad80dd82e3460b8219'
          with (root/'launcher.py').open('xb') as stream: stream.write(raw)
          runner_raw = (root/'owned_runner.py').read_bytes()
          assert hashlib.sha256(runner_raw).hexdigest() == '875d0c360d19768ee28ce59b60286f9ba381c11b9a27f64cfad4338fdd798303'
          module = types.ModuleType('imghost_source_outer_runner')
          module.__file__ = str(root/'owned_runner.py')
          exec(compile(runner_raw, module.__file__, 'exec'), module.__dict__)
          environment = {k:os.environ[k] for k in ('GITHUB_ACTIONS','RUNNER_OS','RUNNER_ENVIRONMENT','GITHUB_REPOSITORY','GITHUB_EVENT_NAME','GITHUB_REF','GITHUB_RUN_ATTEMPT','GITHUB_SHA','GITHUB_WORKFLOW_SHA','RUNNER_TEMP')}
          environment.update(PATH='/usr/bin:/bin', HOME=str(root/'home'), TMPDIR=str(root/'tmp'), LANG='C.UTF-8', LC_ALL='C.UTF-8', GIT_ALLOW_PROTOCOL='')
          try:
              receipt = module.run_owned(['/usr/bin/python3','-I',str(root/'launcher.py')], cwd=root, env=environment, timeout=500, output_path=root/'controller-console.log', output_cap=2*1024**2, sink=lambda b:(sys.stdout.buffer.write(b),sys.stdout.buffer.flush()))
              print('SOURCE_OUTER_RECEIPT', receipt, flush=True)
          except module.RunFailure as error:
              print('SOURCE_OUTER_STOP_RECEIPT', error.receipt, flush=True)
              raise
          print('SOURCE_OUTER_LIMITS root/ownedpipes only; no SDK/device/global cleanup or native qualification', flush=True)
          PY
